name: StatArb Live Dashboard

on:
  schedule:
    # Every 2 hours — reliable and within
    # free tier (1080 min/month vs 2000 limit)
    # Hourly is unreliable on GitHub free tier
    - cron: '0 */2 * * *'

  workflow_dispatch:
    inputs:
      balance:
        description: 'Account balance USD'
        required: false
        default: '10000'
      risk:
        description: 'Risk per trade 0.01=1%'
        required: false
        default: '0.01'

  push:
    branches: [ main ]

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Verify imports
      run: |
        python -c "
        import gspread, pandas, numpy
        import statsmodels, yfinance
        print('All imports OK')
        "

    - name: Run pair research
      run: python pairs_research.py

    - name: Run backtest
      run: python pairs_backtest.py

    - name: Update Google Sheets
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      run: |
        python -m dashboard.scheduler \
          --balance ${{ github.event.inputs.balance || '10000' }} \
          --risk ${{ github.event.inputs.risk || '0.01' }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: statarb-results-${{ github.run_number }}
        path: pairs_artifacts/
        retention-days: 7
