name: StatArb Pair Research

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions button
  push:
    branches: [ main ]

jobs:
  run-research:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas statsmodels matplotlib

    - name: Run Pairs Research Script
      run: |
        python pairs_research.py

    - name: Commit and push generated artifacts
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add pairs_artifacts/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update pairs research artifacts" && git push)
