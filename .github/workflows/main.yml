name: StatArb Full Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy pandas statsmodels matplotlib

    - name: Verify file versions
      run: |
        grep "VERSION" pairs_research.py  || true
        grep "BT_VERSION" pairs_backtest.py || true

    - name: Step 1 — Pair Research
      run: python pairs_research.py

    - name: Step 2 — Walk-Forward Backtest
      run: python pairs_backtest.py

    - name: Upload all artifacts
      uses: actions/upload-artifact@v4
      with:
        name: statarb-results
        path: pairs_artifacts/
        retention-days: 30

    - name: Commit results
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email \
          'github-actions[bot]@users.noreply.github.com'
        git add pairs_artifacts/
        git diff --staged --quiet || \
          git commit -m \
          "Auto: full pipeline $(date +%Y-%m-%d)" && \
          git push
