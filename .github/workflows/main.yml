name: StatArb Pair Research v2

on:
  workflow_dispatch:
  schedule:
    # Re-run every Monday at 00:00 UTC
    # Cointegration changes over time
    - cron: '0 0 * * 1'
  push:
    branches: [ main ]
    paths:
      - 'pairs_research.py'
      - '*.csv'

jobs:
  run-research:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas statsmodels matplotlib

    - name: Run Pairs Research v2
      run: python pairs_research.py

    - name: Show diagnostic report
      run: |
        echo "=== DIAGNOSTIC REPORT ==="
        cat pairs_artifacts/diagnostic_report.json || true
        echo "=== VALID PAIRS ==="
        cat pairs_artifacts/valid_pairs.json || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pairs-research-results
        path: pairs_artifacts/
        retention-days: 30

    - name: Commit results
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email \
          'github-actions[bot]@users.noreply.github.com'
        git add pairs_artifacts/
        git diff --staged --quiet || \
          git commit -m \
          "Auto: pairs research $(date +%Y-%m-%d)" && \
          git push
